<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aluwal · Relevamiento de Obra</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relevamiento">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root{
  --bg:#08090b;
  --surface:#151519;
  --surface2:#1e1e24;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --accent:#eec872;
  --accent-deep:#c9963d;
  --accent-grad:linear-gradient(135deg,#f4d488,#d9a544);
  --accent2:#7b9bf7;
  --text:#f4f4f6;
  --muted:#87879a;
  --success:#4fc189;
  --danger:#ea6666;
  --warning:#f0a458;
  --shadow-sm:0 2px 10px rgba(0,0,0,.28);
  --shadow-md:0 10px 30px rgba(0,0,0,.35);
  --shadow-glow:0 6px 24px rgba(238,200,114,.22);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'DM Sans',sans-serif;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(238,200,114,.07), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(123,155,247,.06), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  font-size:14px;
  padding-bottom:80px;
  -webkit-font-smoothing:antialiased;
}
.header{
  background:rgba(10,10,13,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:58px;
  position:sticky;
  top:0;
  z-index:100;
  gap:10px;
}
.logo{
  font-size:14px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  background:var(--accent-grad);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.logo span{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;-webkit-text-fill-color:var(--muted);}
.icon-btn{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  width:34px;height:34px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:16px;
  transition:transform .15s, border-color .15s;
  flex-shrink:0;
}
.icon-btn:active{transform:scale(.92);border-color:var(--border-strong);}
.sync-indicator{
  font-size:11px;
  color:var(--muted);
  text-align:center;
  padding:6px 16px;
  min-height:14px;
}
.pendientes-bar{
  display:none;
  align-items:center;
  justify-content:space-between;
  background:rgba(240,164,88,.1);
  border:1px solid rgba(240,164,88,.35);
  color:var(--warning);
  border-radius:12px;
  padding:10px 14px;
  font-size:12px;
  margin-bottom:14px;
}
.pendientes-bar.show{display:flex;}
.pendientes-bar button{
  background:var(--warning);
  color:#211705;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  text-transform:uppercase;
}

.container{padding:16px;max-width:900px;margin:0 auto;}

.section-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:var(--muted);
  margin:18px 0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* OBRA CARDS */
.obras-grid{display:flex;flex-direction:column;gap:12px;}
.obra-card{
  background:linear-gradient(180deg, var(--surface), rgba(21,21,25,.6));
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .15s, border-color .15s, box-shadow .15s;
}
.obra-card:active{transform:scale(.985);border-color:var(--border-strong);}
@media(hover:hover){
  .obra-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-1px);}
}
.obra-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.obra-nombre{font-size:16px;font-weight:600;letter-spacing:.1px;}
.obra-cliente{font-size:12px;color:var(--muted);margin-top:2px;}
.badge{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
  padding:4px 9px;
  border-radius:20px;
  white-space:nowrap;
  font-weight:600;
  border:1px solid transparent;
  background:rgba(238,200,114,.14);color:var(--accent);border-color:rgba(238,200,114,.3);
}
.obra-card-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--muted);
}

.empty-state{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
  font-size:13px;
}
.empty-state .big{font-size:32px;margin-bottom:10px;}

.fab{
  position:fixed;
  bottom:22px;
  right:22px;
  background:var(--accent-grad);
  color:#211705;
  border:none;
  width:58px;height:58px;
  border-radius:50%;
  font-size:27px;
  font-weight:600;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-glow), 0 4px 16px rgba(0,0,0,.45);
  cursor:pointer;
  z-index:90;
  transition:transform .15s;
}
.fab:active{transform:scale(.92);}

/* DETAIL VIEW */
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.back-btn{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  width:32px;height:32px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:16px;
  transition:border-color .15s;
}
.back-btn:active{border-color:var(--border-strong);}
.detail-header{
  background:linear-gradient(180deg, var(--surface), rgba(21,21,25,.6));
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--shadow-sm);
}
.detail-nombre{font-size:20px;font-weight:700;letter-spacing:-.2px;}
.detail-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6;}
.detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

.vent-list{display:flex;flex-direction:column;gap:10px;}
.vent-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  transition:border-color .15s, transform .15s;
}
.vent-card:active{transform:scale(.99);}
.vent-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;cursor:pointer;}
.vent-label{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.2px;}
.vent-actions{display:flex;gap:6px;flex-shrink:0;}
.icon-sm{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--muted);
  width:30px;height:30px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:14px;
  transition:border-color .15s;
}
.icon-sm:active{border-color:var(--border-strong);}
.icon-sm.danger{color:var(--danger);}
.vent-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;cursor:pointer;}
.tag{font-size:11px;padding:4px 9px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text);}
.tag.on{background:rgba(79,193,137,.12);color:var(--success);border-color:rgba(79,193,137,.25);}
.vent-notas{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5;cursor:pointer;}

/* MODAL */
.modal-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(5,5,7,.7);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:200;
  align-items:flex-end;
  justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal{
  background:#131317;
  border:1px solid var(--border-strong);
  border-radius:20px 20px 0 0;
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow-y:auto;
  padding:22px;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
}
@media(min-width:560px){
  .modal-overlay{align-items:center;}
  .modal{border-radius:20px;}
}
.modal-title{
  font-size:15px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;
}
.close-btn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--muted);
  margin-bottom:6px;
}
.field input,.field select,.field textarea{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 13px;
  border-radius:10px;
  font-size:14px;
  font-family:inherit;
  transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.field textarea{resize:vertical;min-height:56px;}

.chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface2);
  cursor:pointer;
  font-size:12.5px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.3px;
  color:var(--muted);
  transition:border-color .15s, background .15s, color .15s;
}
.chip.active{border-color:rgba(238,200,114,.4);color:var(--accent);background:rgba(238,200,114,.1);}

.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle-label{font-size:13.5px;font-weight:500;}
.toggle-btns{display:flex;gap:6px;}
.toggle-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;}
.toggle-btn.si.active{border-color:rgba(79,193,137,.4);color:var(--success);background:rgba(79,193,137,.1);}
.toggle-btn.no.active{border-color:rgba(234,102,102,.35);color:var(--danger);background:rgba(234,102,102,.08);}

.modal-footer{display:flex;gap:10px;margin-top:18px;}
.btn{
  flex:1;
  padding:13px;
  border-radius:11px;
  border:1px solid var(--border);
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.5px;
  cursor:pointer;
  transition:transform .15s, border-color .15s;
  background:transparent;
  color:var(--text);
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent-grad);color:#211705;border-color:transparent;box-shadow:0 4px 16px rgba(238,200,114,.18);}
.btn-ghost{background:transparent;color:var(--text);}
.btn-ghost:active{border-color:var(--border-strong);}
.btn-danger{background:transparent;color:var(--danger);border-color:rgba(234,102,102,.4);flex:0 0 auto;padding:13px 16px;}
.btn-small{flex:0 0 auto;padding:9px 14px;font-size:12px;}
.hidden{display:none !important;}

.share-text{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  font-family:'DM Mono',monospace;
  font-size:11.5px;
  line-height:1.6;
  white-space:pre-wrap;
  max-height:40vh;
  overflow-y:auto;
  color:var(--text);
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Aluwal <span>· Relevamiento</span></div>
  <button class="icon-btn" onclick="syncAll(true)" title="Actualizar">⟳</button>
</div>
<div class="sync-indicator" id="sync-indicator"></div>

<div class="container" id="view-lista">
  <div class="pendientes-bar" id="pendientes-bar">
    <span id="pendientes-text"></span>
    <button onclick="reintentarPendientes()">Reintentar</button>
  </div>
  <div class="section-title">Obras</div>
  <div class="obras-grid" id="obras-grid"></div>
</div>

<div class="container hidden" id="view-detalle">
  <div class="back-row">
    <button class="back-btn" onclick="goLista()">←</button>
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">Detalle de obra</div>
  </div>
  <div class="detail-header">
    <div class="detail-nombre" id="d-nombre"></div>
    <div class="detail-sub" id="d-sub"></div>
    <div class="detail-actions">
      <button class="btn btn-ghost btn-small" onclick="openObraModal(true)">Editar obra</button>
      <button class="btn btn-ghost btn-small" onclick="openCompartir()">Compartir</button>
      <button class="btn btn-danger btn-small" onclick="eliminarObra()">Eliminar obra</button>
    </div>
  </div>

  <div class="section-title">Ventanas <span id="vent-count" style="color:var(--accent);"></span></div>
  <div class="vent-list" id="vent-list"></div>
</div>

<button class="fab" id="fab-btn" onclick="fabClick()">+</button>

<!-- MODAL OBRA -->
<div class="modal-overlay" id="modal-obra">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-obra-title">Nueva obra</span>
      <button class="close-btn" onclick="closeModal('modal-obra')">×</button>
    </div>
    <div class="field"><label>Nombre de la obra</label><input id="fo-nombre" placeholder="Ej: Casa López - Pilar"></div>
    <div class="field"><label>Cliente</label><input id="fo-cliente" placeholder="Nombre del cliente"></div>
    <div class="field"><label>Dirección</label><input id="fo-direccion" placeholder="Dirección de la obra"></div>
    <div class="field"><label>Localidad</label><input id="fo-localidad" placeholder="Ej: Pilar"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-obra')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarObra()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL VENTANA -->
<div class="modal-overlay" id="modal-vent">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-vent-title">Nueva ventana</span>
      <button class="close-btn" onclick="closeModal('modal-vent')">×</button>
    </div>
    <div class="field"><label>Identificación</label><input id="fv-label" placeholder="Ej: V1"></div>
    <div class="field"><label>Notas (a qué ventana se refiere)</label><textarea id="fv-notas" placeholder="Ej: Dormitorio principal, planta alta"></textarea></div>

    <div class="field">
      <label>Medidas (Ancho × Alto)</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input id="fv-ancho" type="number" inputmode="decimal" placeholder="Ancho" style="flex:1;">
        <span style="color:var(--muted);font-weight:700;">×</span>
        <input id="fv-alto" type="number" inputmode="decimal" placeholder="Alto" style="flex:1;">
      </div>
      <div class="chip-grid" id="fv-unidad" style="margin-top:8px;"></div>
    </div>

    <div class="field">
      <label>Tipo</label>
      <div class="chip-grid" id="fv-tipo"></div>
    </div>
    <div class="field">
      <label>Color</label>
      <div class="chip-grid" id="fv-color"></div>
    </div>
    <div class="field">
      <label>Vidrio</label>
      <div class="chip-grid" id="fv-vidrio"></div>
    </div>
    <div class="field hidden" id="fv-vidrio-otro-wrap">
      <label>Especificar vidrio</label>
      <input id="fv-vidrio-otro" placeholder="Ej: laminado 4+4">
    </div>

    <div class="field" style="margin-top:18px;">
      <div class="toggle-row">
        <div class="toggle-label">Mosquitero</div>
        <div class="toggle-btns" id="fv-mosquitero"></div>
      </div>
      <div class="toggle-row">
        <div class="toggle-label">Reja</div>
        <div class="toggle-btns" id="fv-reja"></div>
      </div>
      <div class="toggle-row">
        <div class="toggle-label">Bipunto</div>
        <div class="toggle-btns" id="fv-bipunto"></div>
      </div>
      <div class="toggle-row">
        <div class="toggle-label">Premarco</div>
        <div class="toggle-btns" id="fv-premarco"></div>
      </div>
      <div class="toggle-row">
        <div class="toggle-label">Contramarco</div>
        <div class="toggle-btns" id="fv-contramarco"></div>
      </div>
    </div>

    <div class="field"><label>Extra</label><textarea id="fv-extra" placeholder="Cualquier otra cosa a aclarar"></textarea></div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-vent')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarVentana()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL COMPARTIR -->
<div class="modal-overlay" id="modal-compartir">
  <div class="modal">
    <div class="modal-title">
      <span>Compartir resumen</span>
      <button class="close-btn" onclick="closeModal('modal-compartir')">×</button>
    </div>
    <div class="share-text" id="share-text"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="copiarResumen()">Copiar texto</button>
      <button class="btn btn-primary" onclick="whatsappResumen()">WhatsApp</button>
    </div>
  </div>
</div>

<script>
/* Pegar acá la URL que da Apps Script al implementar como aplicación web
   (Implementar > Nueva implementación > Aplicación web). Ver Code.gs. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby42KisYLUxBJHyJ3ZmUGBV-4JJc3yj-oe5px2Te4EcDVYE-YOWr9NzYcLlS1dDY9KxHA/exec";

const STORAGE_KEY = 'aluwal_relevamiento_cache_v1';
const PENDIENTES_KEY = 'aluwal_relevamiento_pendientes';

const TIPOS = ['Corrediza','Paño fijo','Oscilobatiente','Brazo de empuje','Hoja de abrir','Puerta de abrir','Patagónica','Banderola'];
const COLORES = ['Blanco','Negro','Anodizado','Símil madera'];
const VIDRIOS = ['4mm','3+3','DVH 4/9/4','DVH 3+3/6/4','Otro'];
const UNIDADES = ['cm','mm'];

let state = { obras: [], ventanas: [] };
let pendientes = [];
try{ pendientes = JSON.parse(localStorage.getItem(PENDIENTES_KEY) || '[]'); }catch(e){ console.warn('No se pudo leer pendientes', e); }
let currentObraId = null;
let editingVentanaId = null;
let selTipo = null, selColor = null, selVidrio = null, selUnidad = 'cm';
let selMosquitero = null, selReja = null, selBipunto = null, selPremarco = null, selContramarco = null;

function loadCache(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){
    console.warn('No se pudo leer datos guardados en este dispositivo', e);
    state = { obras: [], ventanas: [] };
  }
}
function saveCache(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.warn('No se pudo guardar en este dispositivo', e);
  }
}
function savePendientes(){
  try{
    localStorage.setItem(PENDIENTES_KEY, JSON.stringify(pendientes));
  }catch(e){
    console.warn('No se pudo guardar pendientes', e);
  }
}
function uid(prefix){
  return (prefix||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function getObra(id){ return state.obras.find(o=>String(o.id)===String(id)); }
function ventanasDeObra(obraId){ return state.ventanas.filter(v=>String(v.obraId)===String(obraId)); }

/* ---------- SYNC CON BACKEND ---------- */
async function syncAll(manual){
  const ind = document.getElementById('sync-indicator');
  ind.textContent = '⏳ Sincronizando...';
  ind.style.color = 'var(--muted)';
  try{
    const resp = await fetch(SCRIPT_URL);
    const json = await resp.json();
    if(json.status === 'ok'){
      state.obras = json.obras || [];
      state.ventanas = json.ventanas || [];
      saveCache();
      ind.textContent = '✓ Actualizado';
      ind.style.color = 'var(--success)';
    }else{
      throw new Error(json.message || 'error');
    }
  }catch(err){
    ind.textContent = manual ? '⚠ Sin conexión, mostrando datos guardados' : '';
    ind.style.color = 'var(--warning)';
  }
  setTimeout(()=>{ ind.textContent=''; }, 3000);
  renderAll();
}

async function postAccion(payload){
  try{
    const resp = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) });
    const json = await resp.json();
    return json.status === 'ok';
  }catch(err){
    return false;
  }
}

function encolarPendiente(payload){
  pendientes.push(payload);
  savePendientes();
  renderPendientesBar();
}

async function reintentarPendientes(){
  const restantes = [];
  for(const p of pendientes){
    const ok = await postAccion(p);
    if(!ok) restantes.push(p);
  }
  pendientes = restantes;
  savePendientes();
  renderPendientesBar();
  syncAll(false);
}

function renderPendientesBar(){
  const bar = document.getElementById('pendientes-bar');
  const text = document.getElementById('pendientes-text');
  if(pendientes.length > 0){
    text.textContent = '⚠ ' + pendientes.length + ' cambio(s) sin sincronizar';
    bar.classList.add('show');
  }else{
    bar.classList.remove('show');
  }
}

function renderAll(){
  renderPendientesBar();
  renderLista();
  if(currentObraId) renderDetalle();
}

/* ---------- LISTA DE OBRAS ---------- */
function renderLista(){
  const grid = document.getElementById('obras-grid');
  if(state.obras.length===0){
    grid.innerHTML = `<div class="empty-state"><div class="big">🏗️</div>Todavía no cargaste ninguna obra.<br>Tocá el + para empezar.</div>`;
    return;
  }
  const ordenadas = [...state.obras].sort((a,b)=> new Date(b.fechaCreacion||0) - new Date(a.fechaCreacion||0));
  grid.innerHTML = ordenadas.map(o=>{
    const ubic = [o.direccion, o.localidad].filter(Boolean).join(', ');
    return `<div class="obra-card" onclick="abrirObra('${o.id}')">
      <div class="obra-card-top">
        <div>
          <div class="obra-nombre">${esc(o.nombre)||'Sin nombre'}</div>
          <div class="obra-cliente">${esc(o.cliente)||'—'}</div>
        </div>
        <span class="badge">${ventanasDeObra(o.id).length} vent.</span>
      </div>
      <div class="obra-card-bottom">
        <span>${esc(ubic)||'Sin dirección'}</span>
      </div>
    </div>`;
  }).join('');
}

function goLista(){
  currentObraId = null;
  document.getElementById('view-detalle').classList.add('hidden');
  document.getElementById('view-lista').classList.remove('hidden');
  document.getElementById('fab-btn').textContent = '+';
  renderAll();
}

function abrirObra(id){
  currentObraId = id;
  document.getElementById('view-lista').classList.add('hidden');
  document.getElementById('view-detalle').classList.remove('hidden');
  renderDetalle();
}

function fabClick(){
  if(currentObraId){
    openVentanaModal(null);
  }else{
    openObraModal(false);
  }
}

/* ---------- DETALLE DE OBRA ---------- */
function renderDetalle(){
  const o = getObra(currentObraId);
  if(!o){ goLista(); return; }
  document.getElementById('d-nombre').textContent = o.nombre || 'Sin nombre';
  const sub = [o.cliente, [o.direccion,o.localidad].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
  document.getElementById('d-sub').textContent = sub || 'Sin datos de cliente/dirección';
  const ventanas = ventanasDeObra(o.id);
  document.getElementById('vent-count').textContent = ventanas.length ? `(${ventanas.length})` : '';

  const list = document.getElementById('vent-list');
  if(ventanas.length===0){
    list.innerHTML = `<div class="empty-state">Todavía no agregaste ventanas.<br>Tocá el + para sumar la primera.</div>`;
    return;
  }
  list.innerHTML = ventanas.map(v=>{
    const medida = (v.ancho && v.alto) ? `<span class="tag on">${esc(v.ancho)} × ${esc(v.alto)} ${esc(v.unidad||'cm')}</span>` : '';
    const tags = [v.tipo, v.color, v.vidrio===('Otro') ? (v.vidrioOtro||'Otro') : v.vidrio].filter(Boolean)
      .map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    const extras = [];
    if(v.mosquitero) extras.push('Mosquitero');
    if(v.reja) extras.push('Reja');
    if(v.bipunto) extras.push('Bipunto');
    if(v.premarco) extras.push('Premarco');
    if(v.contramarco) extras.push('Contramarco');
    const extraTags = extras.map(t=>`<span class="tag on">${t}</span>`).join('');
    return `<div class="vent-card">
      <div class="vent-top" onclick="openVentanaModal('${v.id}')">
        <div class="vent-label">${esc(v.label)}</div>
      </div>
      <div class="vent-actions" style="position:relative;top:-34px;float:right;margin-bottom:-24px;">
        <div class="icon-sm" onclick="duplicarVentana('${v.id}')" title="Duplicar">⧉</div>
        <div class="icon-sm danger" onclick="eliminarVentana('${v.id}')" title="Eliminar">🗑</div>
      </div>
      <div class="vent-tags" onclick="openVentanaModal('${v.id}')">${medida}${tags}${extraTags}</div>
      ${v.notas ? `<div class="vent-notas" onclick="openVentanaModal('${v.id}')">${esc(v.notas)}</div>` : ''}
      ${v.extra ? `<div class="vent-notas" onclick="openVentanaModal('${v.id}')">Extra: ${esc(v.extra)}</div>` : ''}
    </div>`;
  }).join('');
}

/* ---------- MODAL OBRA ---------- */
function openObraModal(editar){
  document.getElementById('modal-obra-title').textContent = editar ? 'Editar obra' : 'Nueva obra';
  if(editar){
    const o = getObra(currentObraId);
    document.getElementById('fo-nombre').value = o.nombre||'';
    document.getElementById('fo-cliente').value = o.cliente||'';
    document.getElementById('fo-direccion').value = o.direccion||'';
    document.getElementById('fo-localidad').value = o.localidad||'';
  }else{
    ['fo-nombre','fo-cliente','fo-direccion','fo-localidad'].forEach(id=>document.getElementById(id).value='');
  }
  openModal('modal-obra');
}
async function guardarObra(){
  const nombre = document.getElementById('fo-nombre').value.trim();
  if(!nombre){ alert('Poné un nombre de obra'); return; }
  const editId = currentObraId;
  const payload = {
    id: editId || uid('O'),
    nombre,
    cliente: document.getElementById('fo-cliente').value.trim(),
    direccion: document.getElementById('fo-direccion').value.trim(),
    localidad: document.getElementById('fo-localidad').value.trim(),
    accion: editId ? 'editar_obra' : 'nueva_obra'
  };

  if(editId){
    Object.assign(getObra(editId), payload);
  }else{
    state.obras.push(Object.assign({fechaCreacion: new Date().toISOString()}, payload));
    currentObraId = payload.id;
  }
  saveCache();
  closeModal('modal-obra');
  if(document.getElementById('view-detalle').classList.contains('hidden')){
    abrirObra(currentObraId);
  }else{
    renderDetalle();
  }
  renderLista();

  const ok = await postAccion(payload);
  if(!ok) encolarPendiente(payload);
}
async function eliminarObra(){
  if(!confirm('¿Eliminar esta obra y todas sus ventanas?')) return;
  const id = currentObraId;
  state.obras = state.obras.filter(o=>String(o.id)!==String(id));
  state.ventanas = state.ventanas.filter(v=>String(v.obraId)!==String(id));
  saveCache();
  goLista();

  const ok = await postAccion({ accion:'eliminar_obra', id });
  if(!ok) encolarPendiente({ accion:'eliminar_obra', id });
}

/* ---------- MODAL VENTANA ---------- */
function chipRow(containerId, options, selected, onSel){
  const el = document.getElementById(containerId);
  el.innerHTML = options.map(op=>`<div class="chip ${op===selected?'active':''}" data-v="${esc(op)}">${esc(op)}</div>`).join('');
  [...el.children].forEach(ch=>{
    ch.onclick = ()=>{ onSel(ch.dataset.v); };
  });
}
function toggleRow(containerId, val, onSel){
  const el = document.getElementById(containerId);
  el.innerHTML = `<div class="toggle-btn si ${val===true?'active':''}" data-v="si">Sí</div><div class="toggle-btn no ${val===false?'active':''}" data-v="no">No</div>`;
  [...el.children].forEach(ch=>{
    ch.onclick = ()=>{ onSel(ch.dataset.v==='si'); };
  });
}

function renderUnidadChips(){ chipRow('fv-unidad', UNIDADES, selUnidad, v=>{ selUnidad=v; renderUnidadChips(); }); }
function renderTipoChips(){ chipRow('fv-tipo', TIPOS, selTipo, v=>{ selTipo=v; renderTipoChips(); }); }
function renderColorChips(){ chipRow('fv-color', COLORES, selColor, v=>{ selColor=v; renderColorChips(); }); }
function renderVidrioChips(){
  chipRow('fv-vidrio', VIDRIOS, selVidrio, v=>{ selVidrio=v; renderVidrioChips(); toggleVidrioOtro(); });
}
function toggleVidrioOtro(){
  document.getElementById('fv-vidrio-otro-wrap').classList.toggle('hidden', selVidrio!=='Otro');
}
function renderToggles(){
  toggleRow('fv-mosquitero', selMosquitero, v=>{ selMosquitero=v; renderToggles(); });
  toggleRow('fv-reja', selReja, v=>{ selReja=v; renderToggles(); });
  toggleRow('fv-bipunto', selBipunto, v=>{ selBipunto=v; renderToggles(); });
  toggleRow('fv-premarco', selPremarco, v=>{ selPremarco=v; renderToggles(); });
  toggleRow('fv-contramarco', selContramarco, v=>{ selContramarco=v; renderToggles(); });
}

function openVentanaModal(ventanaId){
  editingVentanaId = ventanaId;
  const ventanas = ventanasDeObra(currentObraId);
  document.getElementById('modal-vent-title').textContent = ventanaId ? 'Editar ventana' : 'Nueva ventana';

  if(ventanaId){
    const v = ventanas.find(x=>String(x.id)===String(ventanaId));
    document.getElementById('fv-label').value = v.label||'';
    document.getElementById('fv-notas').value = v.notas||'';
    document.getElementById('fv-extra').value = v.extra||'';
    document.getElementById('fv-vidrio-otro').value = v.vidrioOtro||'';
    document.getElementById('fv-ancho').value = v.ancho||'';
    document.getElementById('fv-alto').value = v.alto||'';
    selUnidad = v.unidad || 'cm';
    selTipo = v.tipo||null;
    selColor = v.color||null;
    selVidrio = v.vidrio||null;
    selMosquitero = !!v.mosquitero;
    selReja = !!v.reja;
    selBipunto = !!v.bipunto;
    selPremarco = !!v.premarco;
    selContramarco = !!v.contramarco;
  }else{
    document.getElementById('fv-label').value = `V${ventanas.length+1}`;
    document.getElementById('fv-notas').value = '';
    document.getElementById('fv-extra').value = '';
    document.getElementById('fv-vidrio-otro').value = '';
    document.getElementById('fv-ancho').value = '';
    document.getElementById('fv-alto').value = '';
    selUnidad = 'cm';
    selTipo = null; selColor = null; selVidrio = null;
    selMosquitero = false; selReja = false; selBipunto = false;
    selPremarco = false; selContramarco = false;
  }
  renderUnidadChips(); renderTipoChips(); renderColorChips(); renderVidrioChips(); renderToggles(); toggleVidrioOtro();
  openModal('modal-vent');
}

async function guardarVentana(){
  const label = document.getElementById('fv-label').value.trim();
  if(!label){ alert('Poné una identificación (Ej: V1)'); return; }
  const editId = editingVentanaId;
  const payload = {
    id: editId || uid('V'),
    obraId: currentObraId,
    label,
    notas: document.getElementById('fv-notas').value.trim(),
    ancho: document.getElementById('fv-ancho').value.trim(),
    alto: document.getElementById('fv-alto').value.trim(),
    unidad: selUnidad,
    tipo: selTipo,
    color: selColor,
    vidrio: selVidrio,
    vidrioOtro: document.getElementById('fv-vidrio-otro').value.trim(),
    mosquitero: !!selMosquitero,
    reja: !!selReja,
    bipunto: !!selBipunto,
    premarco: !!selPremarco,
    contramarco: !!selContramarco,
    extra: document.getElementById('fv-extra').value.trim(),
    accion: editId ? 'editar_ventana' : 'nueva_ventana'
  };
  if(editId){
    const idx = state.ventanas.findIndex(v=>String(v.id)===String(editId));
    if(idx > -1) state.ventanas[idx] = Object.assign({}, state.ventanas[idx], payload);
  }else{
    state.ventanas.push(Object.assign({fechaCreacion: new Date().toISOString()}, payload));
  }
  saveCache();
  closeModal('modal-vent');
  renderDetalle();
  renderLista();

  const ok = await postAccion(payload);
  if(!ok) encolarPendiente(payload);
}

async function eliminarVentana(id){
  if(!confirm('¿Eliminar esta ventana?')) return;
  state.ventanas = state.ventanas.filter(v=>String(v.id)!==String(id));
  saveCache();
  renderDetalle();
  renderLista();

  const ok = await postAccion({ accion:'eliminar_ventana', id });
  if(!ok) encolarPendiente({ accion:'eliminar_ventana', id });
}

async function duplicarVentana(id){
  const v = state.ventanas.find(x=>String(x.id)===String(id));
  if(!v) return;
  const payload = Object.assign({}, v, {
    id: uid('V'),
    label: `V${ventanasDeObra(currentObraId).length+1}`,
    accion: 'nueva_ventana'
  });
  delete payload.fechaCreacion;
  state.ventanas.push(Object.assign({fechaCreacion: new Date().toISOString()}, payload));
  saveCache();
  renderDetalle();
  renderLista();

  const ok = await postAccion(payload);
  if(!ok) encolarPendiente(payload);
}

/* ---------- COMPARTIR ---------- */
function buildResumen(){
  const o = getObra(currentObraId);
  const ventanas = ventanasDeObra(currentObraId);
  let txt = `RELEVAMIENTO DE OBRA\n`;
  txt += `Obra: ${o.nombre||'-'}\n`;
  if(o.cliente) txt += `Cliente: ${o.cliente}\n`;
  const ubic = [o.direccion,o.localidad].filter(Boolean).join(', ');
  if(ubic) txt += `Dirección: ${ubic}\n`;
  txt += `\nVENTANAS (${ventanas.length})\n`;
  ventanas.forEach(v=>{
    txt += `\n— ${v.label}\n`;
    if(v.ancho && v.alto) txt += `Medida: ${v.ancho} × ${v.alto} ${v.unidad||'cm'}\n`;
    if(v.tipo) txt += `Tipo: ${v.tipo}\n`;
    if(v.color) txt += `Color: ${v.color}\n`;
    const vidrio = v.vidrio==='Otro' ? (v.vidrioOtro||'Otro') : v.vidrio;
    if(vidrio) txt += `Vidrio: ${vidrio}\n`;
    txt += `Mosquitero: ${v.mosquitero?'Sí':'No'}\n`;
    txt += `Reja: ${v.reja?'Sí':'No'}\n`;
    txt += `Bipunto: ${v.bipunto?'Sí':'No'}\n`;
    txt += `Premarco: ${v.premarco?'Sí':'No'}\n`;
    txt += `Contramarco: ${v.contramarco?'Sí':'No'}\n`;
    if(v.notas) txt += `Notas: ${v.notas}\n`;
    if(v.extra) txt += `Extra: ${v.extra}\n`;
  });
  return txt;
}
function openCompartir(){
  document.getElementById('share-text').textContent = buildResumen();
  openModal('modal-compartir');
}
function copiarResumen(){
  const txt = buildResumen();
  navigator.clipboard.writeText(txt).then(()=>{
    alert('Copiado al portapapeles');
  }).catch(()=>{
    alert('No se pudo copiar. Mantené presionado el texto para copiarlo manualmente.');
  });
}
function whatsappResumen(){
  const txt = buildResumen();
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

/* ---------- UTILS ---------- */
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadCache();
renderAll();
syncAll(false);
setInterval(()=>syncAll(false), 120000);
</script>
